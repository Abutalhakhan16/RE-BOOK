<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join ReBook — Create Your Account</title>
  <meta name="description" content="Create a free ReBook account to sell books, self-publish, and join our reader community.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-mark">📚</span>
        <span class="logo-text">ReBook</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
      </ul>

      <div class="nav-actions">
        <a href="auth.html" class="btn btn-ghost btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Register Card Section -->
  <main class="container-narrow" style="padding-top: 3.5rem; padding-bottom: 5rem;">
    <div class="form-card">
      <div class="form-header">
        <h1>Create Your Account</h1>
        <p>Join thousands of readers, collectors, and independent authors.</p>
      </div>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)">
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="reg-first">First Name</label>
            <input type="text" id="reg-first" class="form-input" placeholder="Elena" autocomplete="given-name">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-last">Last Name</label>
            <input type="text" id="reg-last" class="form-input" placeholder="Rostova" autocomplete="family-name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-username">Username <span class="req">*</span></label>
          <input type="text" id="reg-username" class="form-input" placeholder="elena_author" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span class="req">*</span></label>
          <input type="email" id="reg-email" class="form-input" placeholder="elena@example.org" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password <span class="req">*</span></label>
          <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          <div class="form-hint">Must be at least 6 characters.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; margin-top: 1.5rem;">
          Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); font-size: 0.88rem; color: var(--text-secondary);">
        Already have an account? <a href="auth.html" style="color: var(--text-primary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="footer">
    <div class="footer-bottom" style="border: none; padding-top: 0;">
      <p>&copy; 2024 ReBook. Circular books, fair author royalties, simple design.</p>
    </div>
  </footer>

  <script src="api-service.js"></script>
  <script src="script.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        if (typeof apiService !== 'undefined') {
          await apiService.register({ username, email, password });
          showToast('Account registered successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
          return;
        }
      } catch (err) {
        console.warn('Backend unavailable, creating local demo session.');
        localStorage.setItem('authToken', 'demo-jwt-token-' + username);
        showToast(`Welcome, ${username}! Account created.`, 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      }
    }
  </script>
</body>
</html>
