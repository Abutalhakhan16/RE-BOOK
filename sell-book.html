<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Refurbished Book - ReBook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="logo">📚 ReBook</div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="sell-book.html" class="active">Sell Book</a></li>
                    <li><a href="publish-ebook.html">Publish eBook</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sell Book Form Section -->
    <section class="form-section">
        <div class="form-container">
            <div class="form-card">
                <h1>Sell Your Refurbished Book</h1>
                <p class="form-subtitle">List your book and start earning money today</p>
                
                <form id="sellBookForm" onsubmit="handleSellBook(event)">
                    <div class="form-group">
                        <label for="bookTitle">Book Title</label>
                        <input 
                            type="text" 
                            id="bookTitle" 
                            name="bookTitle" 
                            placeholder="Enter book title" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="bookAuthor">Author Name</label>
                        <input 
                            type="text" 
                            id="bookAuthor" 
                            name="bookAuthor" 
                            placeholder="Enter author name" 
                            required
                        >
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="bookCategory">Category</label>
                            <select id="bookCategory" name="bookCategory" required>
                                <option value="">Select a category</option>
                                <option value="Fiction">Fiction</option>
                                <option value="Non-Fiction">Non-Fiction</option>
                                <option value="Science">Science</option>
                                <option value="History">History</option>
                                <option value="Technology">Technology</option>
                                <option value="Business">Business</option>
                                <option value="Self-Help">Self-Help</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="bookCondition">Condition</label>
                            <select id="bookCondition" name="bookCondition" required>
                                <option value="">Select condition</option>
                                <option value="Like New">Like New</option>
                                <option value="Good">Good</option>
                                <option value="Acceptable">Acceptable</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="bookPrice">Price ($)</label>
                        <input 
                            type="number" 
                            id="bookPrice" 
                            name="bookPrice" 
                            placeholder="Enter price" 
                            step="0.01"
                            min="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="bookDescription">Description (Optional)</label>
                        <textarea 
                            id="bookDescription" 
                            name="bookDescription" 
                            placeholder="Add any additional details about the book's condition or contents"
                            rows="4"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large">List Book for Sale</button>
                </form>

                <div id="successMessage" class="success-message" style="display: none;">
                    <p>✓ Your book has been listed successfully!</p>
                    <p><a href="dashboard.html">View in Dashboard</a></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 ReBook. Making knowledge accessible for everyone.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        function handleSellBook(event) {
            event.preventDefault();
            
            const formData = {
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                category: document.getElementById('bookCategory').value,
                condition: document.getElementById('bookCondition').value,
                price: parseFloat(document.getElementById('bookPrice').value),
                description: document.getElementById('bookDescription').value,
                type: 'refurbished',
                dateAdded: new Date().toISOString()
            };

            // Get existing books from localStorage
            let myBooks = JSON.parse(localStorage.getItem('myBooks')) || [];
            myBooks.push(formData);
            localStorage.setItem('myBooks', JSON.stringify(myBooks));

            // Show success message
            document.getElementById('sellBookForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';

            // Reload page after 2 seconds
            setTimeout(() => {
                location.reload();
            }, 2000);
        }
    </script>
</body>
</html>
